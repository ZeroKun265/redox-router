[package]
name = "redox-router"
version = "0.2.0"
edition = "2021"
authors = ["ZeroKun265"]
description = "RedoxRouter - a node-based PipeWire patchbay (qpwgraph alternative) adding many QOL features for specific control"
license = "GPL-3.0-or-later"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = "0.31"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
anyhow = "1"
pipewire = "0.10"
directories = "5"

[profile.dev]
opt-level = 1
